{% extends 'catalog/base.html' %}
{% load my_tags %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">У Электроника</h1>
    <p class="lead">Магазин "У Электроника" - это интернет магазин, предлагающий различную электронную бытовую
        технику</p>
</div>
<div class="container">
    <h2>Удаление категории</h2>
    <h3>Вы уверены, что хотите удалить категорию?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:catalog' %}" class="btn btn-secondary">Нет, отбой</a>
    </form>
</div>
{% endblock%}
