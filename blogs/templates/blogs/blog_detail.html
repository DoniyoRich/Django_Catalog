{% extends 'blogs/base.html' %}
{% load my_tags %}

{% block content %}

<div class="container">
    <!--    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">-->

    <div class="col">
        <div style="display: flex; margin: 10px">
            <img src="{{ blog.image | media_filter }}" style="width: 100px">
            <p><b>{{ blog.title }}</b></p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body" style="width: 100%">
                <p class="card-text"><b></b> {{ blog.content }}</p>
                <p class="card-text"><b>Дата создания:</b> {{ blog.created_at }}</p>
                <p class="card-text"><b>Просмотров:</b> {{ blog.views_count }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <div class="btn-group">
                        <a class="btn btn-primary" href="{% url 'blogs:blogs' %}" role="button">Назад</a>
                        <a class="btn btn-primary" href="{% url 'blogs:update_blog' blog.pk %}"
                           role="button">Изменить</a>
                        <a class="btn btn-primary" href="{% url 'blogs:delete_blog' blog.pk %}"
                           role="button">Удалить</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--    </div>-->
</div>
{% endblock%}
