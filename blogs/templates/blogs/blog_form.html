{% extends 'blogs/base.html' %}
{% load my_tags %}

{% block content %}

<div class="container">
    <h2>Новая статья</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'blogs:blogs' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock%}
