{% extends 'blogs/base.html' %}
{% load my_tags %}

{% block content %}

<div class="container">
    <h2>Удаление статьи</h2>
    <h3>Вы уверены, что хотите удалить статью?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'blogs:blogs' %}" class="btn btn-secondary">Нет, отбой</a>
    </form>
</div>
{% endblock%}
