{% extends 'blogs/base.html' %}
{% load my_tags %}

{% block content %}
<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4">Блог</h1>
</div>
<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        {% for blog in blogs %}
        <div class="col">
            <div class="card shadow-sm">
                <img src="{{ blog.image | media_filter }}">
                <div class="card-body">
                    <p class="card-text"><b>Заголовок:</b> {{ blog.title }}</b></p>
                    <p class="card-text"><b>Содержание:</b> {{ blog.content | truncatechars:100 }}</p>
                    <p class="card-text"><b>Просмотры:</b> {{ blog.views_count }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-primary" href="{% url 'blogs:blog_detail' blog.pk %}" role="button">Читать</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock%}
